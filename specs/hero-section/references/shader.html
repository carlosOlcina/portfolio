<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- STITCH_SHADER_START:ANIMATION_42 class="fixed inset-0 w-full h-full" -->
    <div class="fixed inset-0 w-full h-full" style="display: block">
      <canvas
        id="shader-canvas-ANIMATION_42"
        style="display: block; width: 100%; height: 100%"
      ></canvas>
      <script>
        (function () {
          const canvas = document.getElementById('shader-canvas-ANIMATION_42');

          // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
          // This fires on initial layout and whenever the element is resized.
          function syncSize() {
            const w = canvas.clientWidth || 1280;
            const h = canvas.clientHeight || 720;
            if (canvas.width !== w || canvas.height !== h) {
              canvas.width = w;
              canvas.height = h;
            }
          }
          if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(syncSize).observe(canvas);
          }
          syncSize();

          const gl =
            canvas.getContext('webgl') ||
            canvas.getContext('experimental-webgl');
          if (!gl) return;
          const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
          const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;
varying vec2 v_texCoord;

// Simplex noise implementation
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
    vec2 i  = floor(v + dot(v, C.yy) );
    vec2 x0 = v -   i + dot(i, C.xx);
    vec2 i1;
    i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m ;
    m = m*m ;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
    vec3 g;
    g.x  = a0.x  * x0.x  + h.x  * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
}

void main() {
    vec2 st = gl_FragCoord.xy / u_resolution.xy;
    st.y = 1.0 - st.y;
    
    vec2 aspect = vec2(u_resolution.x / u_resolution.y, 1.0);
    vec2 uv = (st - 0.5) * aspect;

    vec2 mouseUV = (u_mouse / u_resolution - 0.5) * aspect;
    mouseUV.y = -mouseUV.y;
    float mouseDist = length(uv - mouseUV);
    float mouseWave = smoothstep(0.5, 0.0, mouseDist);

    float t = u_time * 0.16;
    float n1 = snoise(uv * 1.5 + vec2(t * 0.4, t * 0.25) + mouseWave * 0.35);
    float n2 = snoise(uv * 2.8 - vec2(t * 0.35, n1 * 0.5));
    float n3 = snoise(vec2(n1, n2) * 1.8 + t * 0.18);

    vec3 baseBg = vec3(0.96, 0.97, 1.0);
    vec3 indigo = vec3(0.31, 0.27, 0.90);
    vec3 violet = vec3(0.58, 0.38, 0.96);
    vec3 cyanGlow = vec3(0.18, 0.70, 0.95);
    vec3 warmTone = vec3(0.98, 0.88, 0.85);

    float ribbon = smoothstep(-0.35, 0.75, n1 * 0.6 + n2 * 0.3 + n3 * 0.2);
    
    vec3 fluidColor = mix(indigo, violet, n1 * 0.5 + 0.5);
    fluidColor = mix(fluidColor, cyanGlow, clamp(mouseWave * 1.3, 0.0, 1.0));
    fluidColor = mix(fluidColor, warmTone, clamp(n3 * 0.35, 0.0, 0.4));

    float heroGlow = smoothstep(1.3, 0.1, length(uv - vec2(0.2, 0.1)));
    float mouseGlow = smoothstep(0.4, 0.0, mouseDist) * 0.65;

    float alpha = clamp((ribbon * 0.28 + heroGlow * 0.25 + mouseGlow * 0.35), 0.0, 0.55);
    vec3 finalColor = mix(baseBg, fluidColor, alpha);

    float grain = fract(sin(dot(gl_FragCoord.xy + u_time * 4.0, vec2(12.9898, 78.233))) * 43758.5453) * 0.012;
    finalColor += vec3(grain);

    gl_FragColor = vec4(finalColor, 1.0);
}`;
          function cs(type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
          }
          const prog = gl.createProgram();
          gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
          gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
          gl.linkProgram(prog);
          gl.useProgram(prog);
          const buf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
            gl.STATIC_DRAW,
          );
          const pos = gl.getAttribLocation(prog, 'a_position');
          gl.enableVertexAttribArray(pos);
          gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
          const uTime = gl.getUniformLocation(prog, 'u_time');
          const uRes = gl.getUniformLocation(prog, 'u_resolution');
          const uMouse = gl.getUniformLocation(prog, 'u_mouse');

          // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
          // Shaders that need normalized coords should use: u_mouse / u_resolution.
          let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
          window.addEventListener('mousemove', (event) => {
            const rect = canvas.getBoundingClientRect();
            if (rect.width && rect.height) {
              const nx = (event.clientX - rect.left) / rect.width;
              const ny = 1.0 - (event.clientY - rect.top) / rect.height;
              mouse.x = nx * canvas.width;
              mouse.y = ny * canvas.height;
            }
          });

          function render(t) {
            if (typeof ResizeObserver === 'undefined') syncSize();
            gl.viewport(0, 0, canvas.width, canvas.height);
            if (uTime) gl.uniform1f(uTime, t * 0.001);
            if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
            if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
          }
          render(0);
        })();
      </script>
    </div>
    <!-- STITCH_SHADER_END:ANIMATION_42 -->
  </body>
</html>
